# Cubey full-duplex acoustic echo cancellation.
#
# The virtual sink receives every sample Cubey sends to its speakers. WebRTC
# uses that exact far-end reference to remove speaker leakage from the physical
# microphone before exposing the virtual source to Cubey.
context.modules = [
    {
        name = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 480/48000

            capture.props = {
                node.name = "cubey_aec_capture_internal"
                node.description = "Cubey AEC Physical Mic Capture"
            }
            source.props = {
                node.name = "cubey_echo_cancel_source"
                node.description = "Cubey Echo-Cancelled Microphone"
            }
            sink.props = {
                node.name = "cubey_echo_cancel_sink"
                node.description = "Cubey Echo-Cancelled Speaker"
            }
            playback.props = {
                node.name = "cubey_aec_playback_internal"
                node.description = "Cubey AEC Physical Speaker Playback"
            }
        }
    }
]
