ekf_filter_node:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true
    reset_on_time_jump: true
    odom0: /odom/lidar
    # Only measured position. Neither commands nor duplicated yaw/velocity.
    odom0_config: [true, true, false, false, false, false,
                   false, false, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 2
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    # The measurement node already establishes the session heading reference.
    imu0_relative: false
    imu0_differential: false
    use_control: false
